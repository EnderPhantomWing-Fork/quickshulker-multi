final int mcVersion = project.mcVersion
final boolean unobfuscated = mcVersion >= 26_00_00

apply plugin: 'maven-publish'
apply plugin: 'com.github.hierynomus.license'
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'
apply plugin: 'me.fallenbreath.yamlang'

repositories {
	// Unified format
	mavenCentral()
	maven { url = 'https://jitpack.io' }
	maven { url = 'https://maven.fallenbreath.me/releases' } 					// FallenBreath Maven
	maven { url = 'https://maven.fabricmc.net' } 								// Fabric Maven
	maven { url = 'https://cursemaven.com' } 									// CurseForge Maven
	maven { url = 'https://api.modrinth.com/maven' } 							// Modrinth Maven
	maven { url = 'https://maven.shedaniel.me/' } 								// Shedaniel Maven
	maven { url = 'https://raw.githubusercontent.com/Aton-Kish/mcmod/maven' } 	// AtonKish Maven
	maven { url = 'https://maven.terraformersmc.com/releases' } 				// TerraformersMC Maven
	maven { url = 'https://maven.nucleoid.xyz/releases'} 						// Nucleoid Maven
}

dependencies {
	def processDependency = { dep ->
		// https://github.com/FabricMC/fabric-loader/issues/783
		if (dep instanceof ModuleDependency && !(dep.group == 'net.fabricmc' && dep.name == 'fabric-loader')) {
			dep.exclude group: 'net.fabricmc', module: 'fabric-loader'
		}
		return dep
	}
	def autoImplementation = { Object... args -> processDependency(unobfuscated ? implementation(*args) : modImplementation(*args)) }
	def autoRuntimeOnly = { Object... args -> processDependency(unobfuscated ? runtimeOnly(*args) : modRuntimeOnly(*args)) }
	def autoCompileOnly = { Object... args -> processDependency(unobfuscated ? compileOnly(*args) : modCompileOnly(*args)) }

	// loom
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (!unobfuscated) {
		//使用 mojang 映射 | Use mojang mappings
		mappings loom.officialMojangMappings()
	}
    autoImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

// runtime mods
	autoImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	autoImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	if (mcVersion >= 260000) {
		// None Reinforced Shulker Boxes and Reinforced Core in 26.1
	} else {
		autoImplementation ("curse.maven:reinforced-shulker-boxes-529874:${project.reinforced_shulker_boxes_version}")
		autoImplementation "atonkish.reinfcore:reinforced-core:${project.reinforced_core_version}"
	}


	include(autoImplementation("me.fallenbreath:conditional-mixin-fabric:${project.conditionalmixin_version}"))
	compileOnly group: "com.google.code.findbugs", name: "jsr305", version: "3.0.2"

// example:
//	if (mcVersion < 11904) {
//		autoRuntimeOnly(mcVersion < 11900 ? "com.github.astei:lazydfu:0.1.2" : "com.github.Fallen-Breath:lazydfu:a7cfc44c0c")
//	}
//	// [FEATURE] MIXIN_AUDITOR
//	autoRuntimeOnly 'me.fallenbreath:mixin-auditor:0.1.0'  // FIXME: update for unobfuscated version

// dependencies

}

// Mixin config paths
String QUICK_SHULKER_MIXIN_CONFIG_PATH = 'quickshulker.mixins.json'
String QUICK_SHULKER_COMPAT_MIXIN_CONFIG_PATH = 'quickshulker-compat.mixins.json'
String SHULKER_UTILS_MIXIN_CONFIG_PATH = 'shulkerutils.mixins.json'
String KYRPTCONFIG_MIXIN_CONFIG_PATH = 'kyrptconfig.mixins.json'
String LANG_DIR = 'assets/quickshulker/lang'
JavaVersion JAVA_COMPATIBILITY
if (mcVersion >= 260000) {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_25
} else if (mcVersion >= 12005) {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_21
} else if (mcVersion >= 11800) {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_17
} else if (mcVersion >= 11700) {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_16
} else {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_1_8
}
JavaVersion MIXIN_COMPATIBILITY_LEVEL = JAVA_COMPATIBILITY

loom {
	accessWidenerPath = file("quickshulker.accesswidener")
	def commonVmArgs = ['-Dmixin.debug.export=true', '-Dmixin.debug.verbose=true', '-Dmixin.env.remapRefMap=true']
	def commonProgramArgs = ['--width', '1366', '--height', '768', '--username', 'ShulkerDev']
	runs {
		named("client") {
			ideConfigGenerated(true)
			vmArgs commonVmArgs
			programArgs commonProgramArgs
			runDir = "../../run/client"
		}

		named("server") {
			runDir = "../../run/server"
		}
	}
}

// 模组和构建版本配置 | mod and artifact version configuration
String modVersionSuffix = ''
String artifactVersionSuffix = ''
String artifactVersion = project.mod_version
// 检测GitHub Actions环境变量 | detect github action environment variables
// https://docs.github.com/en/actions/learn-github-actions/environment-variables#default-environment-variables
if (System.getenv("BUILD_RELEASE") != "true") {
	// 正式版没有build后缀，action构建有后缀
	String buildNumber = System.getenv("BUILD_ID")
	modVersionSuffix += buildNumber != null ? ('+build.' + buildNumber) : '-SNAPSHOT' //buildNumber = null加'-SNAPSHOT', buildNumber != null加'+build.${{ buildNumber }}'
	artifactVersionSuffix = '-SNAPSHOT'  // A non-release artifact is always a SNAPSHOT artifact
}
String fullModVersion = project.mod_version + modVersionSuffix
String fullProjectVersion, fullArtifactVersion

// Example version values:
//   project.mod_version     3.0.2                      (the base mod version)
//   modVersionSuffix        +build.25                  (use github action build number if possible)
//   artifactVersionSuffix   -SNAPSHOT
//   fullModVersion          3.0.2+build.25             (the actual mod version to use in the mod)
//   fullProjectVersion      v3.0.2-mc1.21.1+build.25   (in build output jar name)
//   fullArtifactVersion     3.0.2-mc1.21.1-SNAPSHOT    (maven artifact version)

group = project.maven_group
if (System.getenv("JITPACK") == "true") {
	// move mc version into archivesBaseName, so jitpack will be able to organize archives from multiple subprojects correctly
	// quickshulker-mc1.21.x
	base.archivesName = project.archives_base_name + '-mc' + project.minecraft_version
	// v3.0.2-SNAPSHOT or v3.0.2+build.26
	fullProjectVersion = 'v' + project.mod_version + modVersionSuffix
	// 3.0.2-SNAPSHOT
	fullArtifactVersion = artifactVersion + artifactVersionSuffix
} else {
	// quickshulker
	base.archivesName = project.archives_base_name
	// v3.0.2-mc1.21.x-SNAPSHOT or v3.0.2-mc1.21.x+build.26
	fullProjectVersion = 'v' + project.mod_version + '-mc' + project.minecraft_version + modVersionSuffix
	// 3.0.2-mc1.21.x-SNAPSHOT
	fullArtifactVersion = artifactVersion + '-mc' + project.minecraft_version + artifactVersionSuffix
}
// JITPACK(true): 	v3.0.2-SNAPSHOT or v3.0.2+build.26
// JITPACK(false):	v3.0.2-mc1.21.x-SNAPSHOT or v3.0.2-mc1.21.x+build.26
version = fullProjectVersion

// See https://youtrack.jetbrains.com/issue/IDEA-296490
// if IDEA complains about "Cannot resolve resource filtering of MatchingCopyAction" and you want to know why
processResources {
	from "quickshulker.accesswidener"
	def modProperties = [
			"id"                  : project.mod_id,
			"name"                : project.mod_name,
			"version"             : fullModVersion,
			"minecraft_dependency": project.minecraft_dependency,
	]
	inputs.properties(modProperties)

	filesMatching("fabric.mod.json") {
		expand modProperties
	}

// Mixin JAVA_VERSION
	filesMatching(QUICK_SHULKER_MIXIN_CONFIG_PATH) {
		filter { s -> s.replace('{{COMPATIBILITY_LEVEL}}', "JAVA_${MIXIN_COMPATIBILITY_LEVEL.ordinal() + 1}") }
	}

	filesMatching(QUICK_SHULKER_COMPAT_MIXIN_CONFIG_PATH) {
		filter { s -> s.replace('{{COMPATIBILITY_LEVEL}}', "JAVA_${MIXIN_COMPATIBILITY_LEVEL.ordinal() + 1}") }
	}

	filesMatching(SHULKER_UTILS_MIXIN_CONFIG_PATH) {
		filter { s -> s.replace('{{COMPATIBILITY_LEVEL}}', "JAVA_${MIXIN_COMPATIBILITY_LEVEL.ordinal() + 1}") }
	}

	filesMatching(KYRPTCONFIG_MIXIN_CONFIG_PATH) {
		filter { s -> s.replace('{{COMPATIBILITY_LEVEL}}', "JAVA_${MIXIN_COMPATIBILITY_LEVEL.ordinal() + 1}") }
	}
}

// https://github.com/Fallen-Breath/yamlang
yamlang {
	targetSourceSets = [sourceSets.main]
	inputDir = LANG_DIR
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
	if (JAVA_COMPATIBILITY <= JavaVersion.VERSION_1_8) {
		// suppressed "source/target value 8 is obsolete and will be removed in a future release"
		options.compilerArgs << '-Xlint:-options'
	}
}

java {
	sourceCompatibility = JAVA_COMPATIBILITY
	targetCompatibility = JAVA_COMPATIBILITY
	withSourcesJar()
}

jar.each { Jar task ->
	task.configure {
		inputs.property "archives_base_name", project.archives_base_name
		from(rootProject.file('LICENSE')) {
			rename { "${it}_${project.archives_base_name}" }
		}
	}
}

// https://github.com/hierynomus/license-gradle-plugin
license {
	// use "gradle licenseFormat" to apply license headers
	header = rootProject.file('HEADER.txt')
	include '**/*.java'
	skipExistingHeaders = true

	headerDefinitions {
		// ref: https://github.com/mathieucarbou/license-maven-plugin/blob/4c42374bb737378f5022a3a36849d5e23ac326ea/license-maven-plugin/src/main/java/com/mycila/maven/plugin/license/header/HeaderType.java#L48
		// modification: add a newline at the end
		SLASHSTAR_STYLE_NEWLINE {
			firstLine = "/*"
			beforeEachLine = " * "
			endLine = " */" + System.lineSeparator()
			afterEachLine = ""
			skipLinePattern = null
			firstLineDetectionPattern = "(\\s|\\t)*/\\*.*\$"
			lastLineDetectionPattern = ".*\\*/(\\s|\\t)*\$"
			allowBlankLines = false
			isMultiline = true
			padLines = false
		}
	}
	mapping {
		java = 'SLASHSTAR_STYLE_NEWLINE'
	}
	ext {
		name = project.mod_name
		author = 'kyrptonaught'
		year = Calendar.getInstance().get(Calendar.YEAR).toString()
	}
}
classes.dependsOn licenseFormatMain
testClasses.dependsOn licenseFormatTest

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			artifactId = base.archivesName.get()
			version = fullArtifactVersion
		}
	}

	// select the repositories you want to publish to
	repositories {
		mavenLocal()
		maven {
			url = "$rootDir/publish"
		}
	}
}

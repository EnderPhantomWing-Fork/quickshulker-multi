final int mcVersion = project.mcVersion
final boolean unobfuscated = mcVersion >= 26_00_00

apply plugin: 'maven-publish'
apply plugin: 'com.github.hierynomus.license'
apply plugin: 'com.gradleup.shadow'
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'
apply plugin: 'me.fallenbreath.yamlang'

repositories {
	// 统一格式
	// Unified format
	maven { url = 'https://maven.parchmentmc.org' }
	maven { url = 'https://jitpack.io' }
	maven { url = 'https://maven.fallenbreath.me/releases' }
	maven { url = 'https://maven.fabricmc.net' }
	maven { url = 'https://cursemaven.com' }
	maven { url = 'https://api.modrinth.com/maven' }
	maven { url = 'https://maven.shedaniel.me/' }
	maven { url = 'https://maven.fallenbreath.me/releases' }
	maven { url = 'https://jitpack.io' }
	maven { url = 'https://raw.githubusercontent.com/Aton-Kish/mcmod/maven' }
	maven { url = 'https://maven.terraformersmc.com/' }
	maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
	def processDependency = { dep ->
		// https://github.com/FabricMC/fabric-loader/issues/783
		if (dep instanceof ModuleDependency && !(dep.group == 'net.fabricmc' && dep.name == 'fabric-loader')) {
			dep.exclude group: 'net.fabricmc', module: 'fabric-loader'
		}
		return dep
	}
	def autoImplementation = { Object... args -> processDependency(unobfuscated ? implementation(*args) : modImplementation(*args)) }
	def autoRuntimeOnly = { Object... args -> processDependency(unobfuscated ? runtimeOnly(*args) : modRuntimeOnly(*args)) }
	def autoCompileOnly = { Object... args -> processDependency(unobfuscated ? compileOnly(*args) : modCompileOnly(*args)) }

	// loom
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (!unobfuscated) {

//		parchment mappings
		mappings loom.layered() {
			officialMojangMappings()
			if (project.parchment_version.size() > 0) {
				parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
			}
		}

//		使用 mojang 映射
//		Use mojang mappings
//		mappings loom.officialMojangMappings()
	}
    autoImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

// runtime mods
	if (mcVersion == 12101) {
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
		modImplementation("com.terraformersmc:modmenu:11.0.3") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation ("curse.maven:reinforced-shulker-boxes-529874:6038336") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation "atonkish.reinfcore:reinforced-core:4.0.2+1.21.1"
	} else if (mcVersion == 12103) {
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
		modImplementation("com.terraformersmc:modmenu:12.0.0") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation ("curse.maven:peek-693418:5837969") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation ("curse.maven:reinforced-shulker-boxes-529874:6047615") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation "atonkish.reinfcore:reinforced-core:4.0.3+1.21.3"
	} else if (mcVersion == 12104) {
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
		modImplementation("com.terraformersmc:modmenu:13.0.0") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation ("curse.maven:reinforced-shulker-boxes-529874:6125897") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation "atonkish.reinfcore:reinforced-core:4.0.4+1.21.4"
	} else if (mcVersion == 12105) {
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
		modImplementation("com.terraformersmc:modmenu:14.0.0-rc.2") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation ("curse.maven:reinforced-shulker-boxes-529874:6429113") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation "atonkish.reinfcore:reinforced-core:4.0.6+1.21.5"
	} else if (mcVersion == 12108) {
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
		modImplementation("com.terraformersmc:modmenu:15.0.0") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation ("curse.maven:peek-693418:6945349") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation ("curse.maven:reinforced-shulker-boxes-529874:6813003") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation "atonkish.reinfcore:reinforced-core:4.0.7+1.21.8"
	} else if (mcVersion == 12110) {
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
		modImplementation ("com.terraformersmc:modmenu:16.0.0-rc.1") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation ("curse.maven:reinforced-shulker-boxes-529874:7225066") { exclude group: "net.fabricmc.fabric-api" }
		modImplementation "atonkish.reinfcore:reinforced-core:4.0.8+1.21.10"
	} else if (mcVersion == 12111) {
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
		modImplementation ("com.terraformersmc:modmenu:17.0.0-alpha.1") { exclude group: "net.fabricmc.fabric-api" }
		// 1.21.11 强制加载会黑屏
		// 1.21.11 Forced loading will cause a black screen
//		modImplementation ("curse.maven:reinforced-shulker-boxes-529874:7225066") { exclude group: "net.fabricmc.fabric-api" }
//		modImplementation "atonkish.reinfcore:reinforced-core:4.0.8+1.21.10"
	} else if (mcVersion == 260100) {
		autoImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
//		modImplementation ("com.terraformersmc:modmenu:18.0.0-alpha.3") { exclude group: "net.fabricmc.fabric-api" }
	}

	include(autoImplementation("me.fallenbreath:conditional-mixin-fabric:${project.conditionalmixin_version}"))
	compileOnly group: "com.google.code.findbugs", name: "jsr305", version: "3.0.2"

//	if (!unobfuscated) {
//		// not included in fabric loader 0.15.0+, so we need to shadow it
//		// unused in unobfuscated versions, so don't add it in those
//		shadow(implementation("net.fabricmc:tiny-mappings-parser:0.3.0+build.17"))
//	}

// example:
//	if (mcVersion < 11904) {
//		autoRuntimeOnly(mcVersion < 11900 ? "com.github.astei:lazydfu:0.1.2" : "com.github.Fallen-Breath:lazydfu:a7cfc44c0c")
//	}
//	// [FEATURE] MIXIN_AUDITOR
//	autoRuntimeOnly 'me.fallenbreath:mixin-auditor:0.1.0'  // FIXME: update for unobfuscated version

// dependencies

}

// Mixin config paths  TODO: 等待26.x版本更新启用 / Wait for the 26.x update to take effect
//String MIXIN_CONFIG_PATH = 'quickshulker.mixins.json'
String QUICK_SHULKER_MIXIN_CONFIG_PATH = 'quickshulker.mixins.json'
String QUICK_SHULKER_COMPAT_MIXIN_CONFIG_PATH = 'quickshulker-compat.mixins.json'
String SHULKER_UTILS_MIXIN_CONFIG_PATH = 'shulkerutils.mixins.json'
String KYRPTCONFIG_MIXIN_CONFIG_PATH = 'kyrptconfig.mixins.json'
String LANG_DIR = 'assets/quickshulker/lang'
JavaVersion JAVA_COMPATIBILITY
if (mcVersion >= 260000) {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_25
} else if (mcVersion >= 12005) {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_21
} else if (mcVersion >= 11800) {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_17
} else if (mcVersion >= 11700) {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_16
} else {
	JAVA_COMPATIBILITY = JavaVersion.VERSION_1_8
}
JavaVersion MIXIN_COMPATIBILITY_LEVEL = JAVA_COMPATIBILITY

loom {
	accessWidenerPath = file("quickshulker.accesswidener")
	def commonVmArgs = ['-Dmixin.debug.export=true', '-Dmixin.debug.countInjections=true']
	runConfigs.configureEach {
		// to make sure it generates all "Minecraft Client (:subproject_name)" applications
		ideConfigGenerated = true
		runDir '../../run'
		vmArgs commonVmArgs
	}
}


name: build
on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'github release name. such as 3.0.0-SNAPSHOT'
        required: true
      tag_name:
        description: 'github tag name. usually it is the same as the release_name'
        required: true
  push: null
  pull_request: null

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        name: Setup Java 25
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Delete sources.jar artifacts
        run: |
          echo "=== 清理前统计 ==="
          find . -type f -name "*.jar" | grep -c "sources" || true
          echo "总jar文件数: $(find . -type f -name "*.jar" | wc -l)"
          echo "=== 开始删除 sources.jar ==="
          find . -path "*/build/libs/*sources.jar" -type f -delete
          echo "=== 清理后统计 ==="
          echo "剩余jar文件数: $(find . -type f -name "*.jar" | wc -l)"

      - name: Upload Build Artifacts [CI Build]
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: versions/*/build/libs/*.jar

      - name: Upload artifacts to release [Manually Release Build]
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          files: versions/*/build/libs/!(*-@(dev|sources|shadow)).jar
          tag_name: ${{ github.event.inputs.tag_name }}
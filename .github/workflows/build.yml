name: build
on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'github release name. such as 3.0.0-SNAPSHOT'
        required: true
      tag_name:
        description: 'github tag name. usually it is the same as the release_name'
        required: true
  push: null
  pull_request: null

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        name: Setup Java 25
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Delete sources.jar artifacts
        run: |
          find . -path "versions/*/build/libs/*sources.jar" -type f -delete

      - name: Upload jar files without directories
        run: |
          # 1. 创建目标目录
          mkdir -p common_jars
          # 2. 复制所有jar文件到扁平目录（保留sources.jar的排除逻辑）
          find . -path "versions/*/build/libs/*.jar" ! -name "*sources.jar" -type f -exec cp {} common_jars/ \;
          ls -la common_jars/
          echo "已收集 $(ls common_jars/*.jar 2>/dev/null | wc -l) 个jar文件"

      - name: Upload Build Artifacts [CI Build]
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: common_jars/*.jar

      - name: Upload artifacts to release [Manually Release Build]
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          files: common_jars/*.jar
          tag_name: ${{ github.event.inputs.tag_name }}
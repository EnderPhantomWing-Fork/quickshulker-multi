name: Build
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        default: false
      target_subproject:
        description: see release.yml, leave it empty to build all
        type: string
        required: false
        default: ''
  push: null
  pull_request: null

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        name: Setup Java 25
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Get latest hash
        run: echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
        env:
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: ${{ inputs.release }}

      - name: Upload artifacts (with a file structure)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: versions/*/build/libs/

      - name: Collect jars
        run: |
          shopt -s extglob
          mkdir all-jars
          for jar in versions/*/build/libs/*.jar; do
              cp -p "$jar" all-jars/
          done
          ls -l all-jars

      - name: Collect mod jars
        run: |
          shopt -s extglob
          mkdir mod-jars
          for jar in versions/*/build/libs/!(*-@(dev|sources|shadow)).jar; do
              cp -p "$jar" mod-jars/
          done
          ls -l mod-jars

      - name: Upload all jars
        uses: actions/upload-artifact@v4
        with:
          name: quickshulker
          path: all-jars/*.jar

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: quickshulker-${{ env.COMMIT_HASH }}
          path: mod-jars/*.jar

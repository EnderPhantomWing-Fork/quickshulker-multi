plugins {
	id 'maven-publish'
	id 'com.github.hierynomus.license' version '0.16.1' apply false
	id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT' apply false
	id 'net.fabricmc.fabric-loom-remap' version '1.15-SNAPSHOT' apply false

	// https://github.com/ReplayMod/preprocessor
	// https://github.com/Fallen-Breath/preprocessor
	id 'com.replaymod.preprocess' version 'c5abb4fb12'

	// https://github.com/Fallen-Breath/yamlang
	id 'me.fallenbreath.yamlang' version '1.5.0' apply false
}

preprocess {
	strictExtraMappings = false

	def mc12006 = createNode('1.20.6', 1_20_06, 'official')
	def mc12101 = createNode('1.21.1', 1_21_01, 'official')
	def mc12103 = createNode('1.21.3', 1_21_03, 'official')
	def mc12104 = createNode('1.21.4', 1_21_04, 'official')
	def mc12105 = createNode('1.21.5', 1_21_05, 'official')
	def mc12108 = createNode('1.21.8', 1_21_08, 'official')
	def mc12110 = createNode('1.21.10', 1_21_10, 'official')
	def mc12111 = createNode('1.21.11', 1_21_11, 'official')
	def mc260101 = createNode('26.1.1', 26_01_01, 'official')

	//1.20.6~before
	mc12101.link(mc12006, null)
	//1.21.1~latest
	mc12101.link(mc12103, null)
	mc12103.link(mc12104, null)
	mc12104.link(mc12105, null)
	mc12105.link(mc12108, null)
	mc12108.link(mc12110, null)
	mc12110.link(mc12111, null)
	mc12111.link(mc260101, file("versions/mapping-1.21.11-26.1.1.txt"))

	// See https://github.com/Fallen-Breath/fabric-mod-template/blob/1d72d77a1c5ce0bf060c2501270298a12adab679/build.gradle#L55-L63
	for (final def node in getNodes()) {
		findProject(node.project).ext.mcVersion = node.mcVersion
	}
}

tasks.register('buildAndGather') {
	subprojects {
		dependsOn project.tasks.named('build').get()
	}
	doFirst {
		println 'Gathering builds'
		def buildLibs = {
			p -> p.buildDir.toPath().resolve('libs')
		}
		delete fileTree(buildLibs(rootProject)) {
			include '*'
		}
		subprojects {
			copy {
				from(buildLibs(project)) {
					include '*.jar'
					exclude '*-dev.jar', '*-sources.jar', '*-shadow.jar'
				}
				into buildLibs(rootProject)
				duplicatesStrategy = DuplicatesStrategy.INCLUDE
			}
		}
	}
}

// Reinforced Shulker Boxes
// https://github.com/EnderPhantomWing/quickshulker-multi/commit/57023fb12d3472ada4d84de93e59ebec083a4bd0